<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habit &amp; Home — Shop</title>
  <meta name="description" content="Everyday goods for better habits." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo">Habit<span>&amp;</span>Home</a>
      <form class="search" id="search-form" role="search">
        <input type="search" id="search-input" placeholder="Search products…" aria-label="Search products" />
      </form>
      <a href="#/cart" class="cart-link" aria-label="Cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-count" id="cart-count">0</span>
      </a>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Habit &amp; Home. Demo store — no real payments are processed.</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
